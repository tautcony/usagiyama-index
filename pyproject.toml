[project]
name = "usagiyama-index-scraper"
version = "0.1.0"
description = "「兔子山的小站」(site.douban.com/211330) 内容归档与 VitePress 站点构建工具链"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 传输层：curl-impersonate 的 Python 绑定，模拟真实浏览器的 TLS/HTTP2 指纹。
    # 目标站点对 TLS 指纹有校验，裸 requests 会收到 SSLEOFError。
    "curl-cffi>=0.13.0",
    # 解析层
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "markdownify>=1.0.0",
    # 重试策略（指数退避 + 抖动）
    "tenacity>=9.0.0",
    # 进度显示
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    # 用于在测试里校验生成的 frontmatter 是合法 YAML
    "pyyaml>=6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scraper/tests"]
pythonpath = ["."]
