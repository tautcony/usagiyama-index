[project]
name = "usagiyama-index-scraper"
version = "0.1.0"
description = "「兔子山的小站」(site.douban.com/211330) 内容归档与 VitePress 站点构建工具链"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 传输层（默认）：curl-impersonate 的 Python 绑定，模拟真实浏览器的
    # TLS/HTTP2 指纹。
    "curl-cffi>=0.13.0",
    # 传输层（浏览器）：驱动系统已安装的 Chrome（channel="chrome"），
    # 能执行 JS、携带登录态，用于应对反爬与需登录的页面。
    # 用 channel="chrome" 时无需 `playwright install` 下载浏览器。
    "playwright>=1.49",
    # 解析层
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "markdownify>=1.0.0",
    # 重试策略（指数退避 + 抖动）
    "tenacity>=9.0.0",
    # 进度显示
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    # 用于在测试里校验生成的 frontmatter 是合法 YAML
    "pyyaml>=6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scraper/tests"]
pythonpath = ["."]
markers = [
    "network: 会发起真实网络请求（默认不执行，用 -m network 启用）",
    "browser: 需要真实浏览器（默认不执行，用 -m browser 启用）",
]
# 默认只跑纯离线、零浏览器的测试。
# 由 conftest.forbid_real_transport 强制保证：未标记的测试一旦试图
# 创建真实 session / 启动真实浏览器就会失败。
addopts = "-m 'not network and not browser'"
